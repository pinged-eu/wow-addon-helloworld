name: Package and release
on:
  push:
    tags:
      - "v*"
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Package and release
        uses: BigWigsMods/packager@v2
